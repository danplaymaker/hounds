# Canonical track metadata for the 18 GBGB-licensed UK tracks.
# Used to normalise track names across GBGB and Betfair sources,
# and to attach default distance/going adjustments.
#
# Canonical names are lowercase, hyphen-free, single-word where possible.
# Aliases capture observed variants from each source.
#
# Going adjustments are placeholder; refine empirically from race data
# (median run-time delta per going band) once A1 produces enough rows.

tracks:
  - canonical: central_park
    display:   "Central Park"
    aliases:   ["Central Park", "Central Park (Sittingbourne)", "Sittingbourne"]
    distances_m: [264, 480, 642, 714]

  - canonical: crayford
    display:   "Crayford"
    aliases:   ["Crayford", "Crayford & Bexleyheath"]
    distances_m: [380, 540, 714, 874]

  - canonical: doncaster
    display:   "Doncaster"
    aliases:   ["Doncaster"]
    distances_m: [273, 451, 642]

