# Template for secrets — copy to config/secrets.yaml and fill in.
# config/secrets.yaml is gitignored and never leaves your machine.
#
# Get an app key at https://docs.developer.betfair.com
#   - "Application Keys" tab while logged into a Betfair account
#   - The DELAYED key is free and fine for cards + 60s-delayed prices

betfair:
  username: your.betfair.username
  password: your-betfair-password
  app_key:  YOUR_APP_KEY
  # Cert / non-cert login — non-cert is simplest; some accounts (Italy/Spain)
  # need cert. Leave 'login_method' on 'interactive' unless you have certs.
  login_method: interactive
